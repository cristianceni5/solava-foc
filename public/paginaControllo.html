<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controllo attributi estesi - Factory Operation Panel</title>
    <link rel="shortcut icon" href="./assets/logo-solava-rid.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/interne.css">
    <link rel="stylesheet" href="./css/articoli.css">
    <!-- CDN di FA -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        referrerpolicy="no-referrer">
</head>

<body class="pagina-interna pagina-articolo">
    <header class="navigazione navigazione-pagina">
        <a href="index.html#strumenti" class="nav-back" aria-label="Torna agli strumenti nel pannello operativo"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Pannello</a>
        <a href="index.html" class="nav-brand" aria-label="Factory Operation Panel - pagina principale">
            <img src="./assets/logo-solava-rossaccio.svg" alt="Solava" class="logo">
            <span>Factory Operation Panel</span>
        </a>
        <span class="nav-page-current">Controllo attributi estesi</span>
    </header>
    <!-- Interfaccia di ricerca e risultato popolato da attributi.js -->
    <div class="mega-container">
        <div class="container">
            <h1>Controllo attributi estesi</h1>
            <p>Cerca un articolo per consultarne gli attributi estesi.</p>
            <br>
            <div class="ricerca">
                <label for="inputArticolo" class="sr-only">Codice articolo</label>
                <input type="text" id="inputArticolo" placeholder="Codice articolo" autocomplete="off" autofocus>
                <button type="button" id="btnCerca">Cerca</button>
            </div>
            <!-- Cronologia delle ultime ricerche, salvata in localStorage -->
            <div class="cronologia" id="cronologia"></div>

            <p id="errore" class="errore" role="alert" aria-live="assertive"></p>
            <!-- Risultato della ricerca -->
            <div id="risultato"></div>
        </div>
    </div>

    <button type="button" id="frecciaTeletrasporto" class="freccia-teletrasporto" title="Vai ai dettagli dell'articolo"
        aria-label="Vai ai dettagli dell'articolo">
        <i class="fa-solid fa-arrow-down" aria-hidden="true"></i>
    </button>

    <script src="./js/attributi.js"></script>
    <script src="./js/presenza.js" defer></script>
</body>

</html>
