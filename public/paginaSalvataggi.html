<!DOCTYPE html>
<!-- Autore: Codex | Ultima modifica: 10/10/2026
     Scopo: consultare gli ultimi salvataggi di produzione della prelavorazione. -->
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salvataggi - Prelavorazione - Factory Operation Panel</title>
    <link rel="icon" href="./assets/logo-solava-rid.png">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/interne.css">
    <link rel="stylesheet" href="./css/salvataggi.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer">
</head>
<body class="pagina-interna" data-vista="tabella">
    <header class="navigazione navigazione-pagina">
        <a href="index.html#salvataggi" class="nav-back" aria-label="Torna ai salvataggi nel pannello operativo"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Pannello</a>
        <a href="index.html" class="nav-brand" aria-label="Factory Operation Panel - pagina principale"><img src="./assets/logo-solava-rossaccio.svg" alt="Solava" class="logo"><span>Factory Operation Panel</span></a>
        <span class="nav-page-current">Salvataggi - Prelavorazione</span>
    </header>
    <main class="mega-container salvataggi-pagina">
      <div class="container">
        <div class="salvataggi-intro">
            <p id="ultimo-caricamento" class="ultimo-aggiornamento">Ultimo aggiornamento: in attesa</p>
            <h1 class="titolo-pagina">Salvataggi di prelavorazione</h1>
            <p id="stato-salvataggi" role="status" aria-live="polite">Caricamento salvataggi...</p>
            <div class="salvataggi-azioni">
                <button type="button" id="aggiorna-salvataggi" class="pulsante-operativo pulsante-secondario">Aggiorna dati</button>
            </div>
        </div>
        <nav class="salvataggi-viste" aria-label="Viste dei salvataggi">
            <a id="vista-tabella" href="paginaSalvataggi.html" aria-current="page">Tabella</a>
            <a id="vista-report" href="paginaReportSalvataggi.html">Report</a>
        </nav>
        <section id="report-salvataggi" class="report-salvataggi" aria-label="Report del salvataggio" hidden>
            <div class="report-toolbar">
                <h2 id="report-titolo">Riepilogo giornaliero</h2>
                <div class="report-selezione">
                    <div class="report-controlli">
                        <button id="report-precedente" type="button" aria-label="Giorno precedente con salvataggi"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
                        <button id="apri-calendario" type="button" aria-expanded="false" aria-controls="calendario-report"><i class="fa-regular fa-calendar" aria-hidden="true"></i><span id="report-data">Scegli una data</span><i class="fa-solid fa-chevron-down" aria-hidden="true"></i></button>
                        <button id="report-successivo" type="button" aria-label="Giorno successivo con salvataggi"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
                    </div>
                    <section id="calendario-report" class="calendario-report" aria-label="Calendario dei salvataggi" hidden>
                        <div class="calendario-testata">
                            <button id="mese-precedente" type="button" aria-label="Mese precedente"><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button>
                            <label class="sr-only" for="calendario-mese">Mese e anno</label>
                            <input id="calendario-mese" type="month">
                            <button id="mese-successivo" type="button" aria-label="Mese successivo"><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button>
                        </div>
                        <div class="calendario-settimana" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>G</span><span>V</span><span>S</span><span>D</span></div>
                        <div id="calendario-giorni" class="calendario-giorni"></div>
                        <p>Salvataggi caricati per giorno</p>
                        <button id="calendario-senza-data" type="button" hidden>Senza data</button>
                    </section>
                </div>
            </div>
            <div id="report-eventi" class="report-eventi" role="group" aria-label="Eventi della giornata"></div>
            <div id="report-griglia" class="report-griglia"></div>
        </section>
        <div class="table-wrapper salvataggi-tabella" id="contenitore-salvataggi" tabindex="0" role="region" aria-label="Tabella dei salvataggi" hidden>
            <table aria-label="Salvataggi di prelavorazione"><thead id="intestazione-salvataggi"></thead><tbody id="righe-salvataggi"></tbody></table>
        </div>
        <div id="salvataggi-vuoto" class="salvataggi-vuoto" hidden></div>
        <div class="salvataggi-footer">
            <nav class="salvataggi-paginazione" aria-label="Pagine dei salvataggi" id="paginazione-salvataggi" hidden>
                <button type="button" id="pagina-precedente" class="pulsante-operativo pulsante-secondario">Precedente</button>
                <span id="numero-pagina" aria-live="polite"></span>
                <button type="button" id="pagina-successiva" class="pulsante-operativo pulsante-secondario">Successiva</button>
            </nav>
            <div class="salvataggi-meta"><p id="conteggio-salvataggi"></p></div>
        </div>
        <dialog id="anteprima-salvataggio" class="anteprima-lavorazione" aria-labelledby="anteprima-salvataggio-titolo">
            <div class="anteprima-lavorazione-header">
                <div>
                    <p class="anteprima-eyebrow">Dettaglio salvataggio</p>
                    <h2 id="anteprima-salvataggio-titolo">Dati completi</h2>
                </div>
                <a id="apri-report-salvataggio" class="pulsante-operativo pulsante-secondario" href="paginaReportSalvataggi.html">Apri report</a>
                <button type="button" id="chiudi-anteprima-salvataggio" class="chiudi-anteprima" aria-label="Chiudi dettaglio">
                    <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                </button>
            </div>
            <dl id="anteprima-salvataggio-valori" class="anteprima-valori"></dl>
        </dialog>
      </div>
    </main>
    <script src="./vendor/gsap/gsap.min.js"></script>
    <script src="./js/salvataggi.js"></script>
</body>
</html>
