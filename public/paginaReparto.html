<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reparto - Factory Operation Panel</title>
    <link rel="shortcut icon" href="./assets/logo-solava-rid.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/interne.css">
    <link rel="stylesheet" href="./css/salvataggi.css">
    <!-- CDN di FA -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        referrerpolicy="no-referrer">
</head>

<body class="pagina-interna">
    <header class="navigazione navigazione-pagina">
        <a href="index.html#monitor" class="nav-back" aria-label="Torna ai monitor nel pannello operativo"><i
                class="fa-solid fa-arrow-left" aria-hidden="true"></i> Pannello</a>
        <a href="index.html" class="nav-brand" aria-label="Factory Operation Panel - pagina principale">
            <img src="./assets/logo-solava-rossaccio.svg" alt="Solava" class="logo">
            <span>Factory Operation Panel</span>
        </a>
        <span class="nav-page-current" id="nome-reparto-head">Monitor reparto</span>
    </header>
    <!-- Container con la tabelle delle lavorazioni -->
    <div class="mega-container">
        <div class="container">
            <div id="status-banner" role="status" aria-live="polite">
                <p id="ultimo-aggiornamento" class="ultimo-aggiornamento"></p>
                <h1 id="stato" class="titolo-pagina"><i class="fa-solid fa-spinner fa-spin"></i> Caricamento dati...
                </h1>
                <p id="risposta"></p>
                <div class="salvataggi-azioni">
                    <button type="button" id="apri-coda" class="pulsante-operativo pulsante-secondario">
                        <i class="fa-solid fa-box"></i>
                        Apri coda
                    </button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="tabella-reparto">
                    <thead id="tabella-intestazione">
                    </thead>
                    <tbody id="tabella-dati">
                    </tbody>
                </table>
            </div>

            <dialog id="anteprima-lavorazione" class="anteprima-lavorazione" aria-labelledby="anteprima-titolo">
                <div class="anteprima-lavorazione-header">
                    <div>
                        <p class="anteprima-eyebrow">Dettaglio lavorazione</p>
                        <h2 id="anteprima-titolo">Anteprima estesa</h2>
                    </div>
                    <button type="button" id="chiudi-anteprima" class="chiudi-anteprima" aria-label="Chiudi anteprima">
                        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
                    </button>
                </div>
                <dl id="anteprima-valori" class="anteprima-valori"></dl>
            </dialog>

            <br>

            <div class="legenda-wrapper">
                <h2>Legenda stato</h2>
                <div class="legenda-container">
                    <ul class="legenda-li">
                        <li>
                            <div class="stato-sodo"></div>
                            <p>Assente</p>
                        </li>
                        <li>
                            <div class="stato-attenzione"></div>
                            <p>Sospesa</p>
                        </li>
                        <li>
                            <div class="stato-bono"></div>
                            <p>Ripresa, Iniziata o Lanciata</p>
                        </li>
                        <li>
                            <div class="stato-finita"></div>
                            <p>Finita</p>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/reparto.js"></script>
</body>

</html>
